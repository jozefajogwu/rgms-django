<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | RGMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 border">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-950">RGMS Login</h1>
            <p class="text-slate-600 mt-2">
                Access your doctor or caregiver dashboard.
            </p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-5 rounded-lg bg-red-100 border border-red-300 text-red-700 px-4 py-3">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Username
                </label>
                <input type="text" name="username" required
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Password
                </label>
                <input type="password" name="password" required
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>

            <button type="submit"
                class="w-full bg-blue-950 hover:bg-blue-900 text-white font-semibold py-4 rounded-xl">
                Login
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Authorized RGMS users only.
        </p>
    </div>

</body>
</html>
